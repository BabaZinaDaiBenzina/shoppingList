<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#gradient)"/>

  <!-- Shopping Cart Icon -->
  <g transform="translate(32, 32)">
    <!-- Cart body -->
    <path
      d="M8 8 L14 8 L18 38 L50 38 L54 18 L20 18"
      stroke="white"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Cart wheels -->
    <circle cx="24" cy="48" r="4" fill="white"/>
    <circle cx="46" cy="48" r="4" fill="white"/>

    <!-- Shopping items -->
    <rect x="28" y="4" width="8" height="8" rx="1" fill="white" opacity="0.9"/>
    <circle cx="52" cy="8" r="4" fill="white" opacity="0.9"/>
  </g>
</svg>
