# Nginx конфигурация для Shopping List с HTTPS
# Сохраните в /etc/nginx/sites-available/shoppinglist

server {
    listen 80;
    server_name your-domain.com;  # ← Замените на свой домен

    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # ← Замените на свой домен

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Логи
    access_log /var/log/nginx/shoppinglist-access.log;
    error_log /var/log/nginx/shoppinglist-error.log;

    # Прокси на Next.js приложение
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Заголовки для корректной работы
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Кеширование статики
        proxy_cache_bypass $http_upgrade;
    }

    # Статические файлы (опционально - можно отдавать напрямую nginx)
    location /_next/static {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker - важные заголовки для корректной работы
    location /sw.js {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed /;
    }

    # Workbox скрипты
    location /workbox-*.js {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manifest
    location /manifest.webmanifest {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Type application/manifest+json;
    }

    # Иконки PWA
    location ~* ^/(icon-|apple-touch-icon|favicon) {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
